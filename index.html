<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>晚餐扭蛋機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161327;
    --bg-mid:#201c38;
    --bg-panel:#2a2447;
    --paper:#f6efe1;
    --muted:#a79bd1;
    --guava:#ff5d73;
    --turmeric:#ffc145;
    --scallion:#3ddc97;
    --grape:#b18cff;
    --line: rgba(246,239,225,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #352c5c 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid) 60%, var(--bg-deep));
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
    overflow-x:hidden;
  }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:.35em;
    font-size:12px;
    color:var(--turmeric);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-size:clamp(28px,5vw,42px);
    margin:0 0 6px;
    font-weight:900;
    text-align:center;
    line-height:1.3;
  }
  h1 span{color:var(--guava);}
  .sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:30px;
    text-align:center;
  }

  /* ---- Gacha machine ---- */
  .machine-wrap{
    position:relative;
    width:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .dome{
    width:230px;
    height:190px;
    border-radius:130px 130px 20px 20px;
    background:linear-gradient(160deg, rgba(246,239,225,0.16), rgba(246,239,225,0.03) 60%);
    border:3px solid var(--line);
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 -20px 40px rgba(0,0,0,0.35), 0 0 40px rgba(177,140,255,0.15);
  }
  .capsule{
    position:absolute;
    width:34px;height:34px;
    border-radius:50%;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,0.18), inset 3px 3px 0 rgba(255,255,255,0.25);
    animation: jiggle 3.2s ease-in-out infinite;
  }
  .capsule::after{
    content:'';
    position:absolute;
    left:0;right:0;top:47%;
    height:2px;
    background:rgba(0,0,0,0.18);
  }
  .c1{background:var(--guava); top:18px; left:20px; animation-delay:.1s;}
  .c2{background:var(--turmeric); top:10px; left:80px; animation-delay:.5s;}
  .c3{background:var(--scallion); top:22px; left:145px; animation-delay:.2s;}
  .c4{background:var(--grape); top:55px; left:50px; animation-delay:.7s;}
  .c5{background:var(--turmeric); top:60px; left:110px; animation-delay:.35s;}
  .c6{background:var(--scallion); top:58px; left:170px; animation-delay:.9s;}
  .c7{background:var(--guava); top:92px; left:85px; animation-delay:.15s;}
  .c8{background:var(--grape); top:95px; left:145px; animation-delay:.6s;}
  .c9{background:var(--turmeric); top:100px; left:25px; animation-delay:.45s;}

  @keyframes jiggle{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-4px) rotate(4deg);}
  }
  .shaking .capsule{animation: shake .4s ease-in-out infinite;}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(-3px,2px) rotate(-8deg);}
    50%{transform:translate(3px,-2px) rotate(8deg);}
    75%{transform:translate(-2px,-3px) rotate(-6deg);}
  }

  .base{
    width:250px;
    height:150px;
    background:linear-gradient(180deg, var(--bg-panel), #1d1938);
    border:3px solid var(--line);
    border-top:none;
    border-radius:0 0 22px 22px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:16px;
  }
  .knob{
    width:64px;height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe3a8, var(--turmeric));
    box-shadow:0 4px 0 #b8862a, 0 6px 10px rgba(0,0,0,0.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';
    font-weight:800;
    color:#5c3d0d;
    font-size:12px;
    user-select:none;
    transition:transform .15s;
    border:none;
  }
  .knob:active{transform:translateY(3px);box-shadow:0 1px 0 #b8862a;}
  .knob:disabled{opacity:.55;cursor:default;}
  .knob.spin-anim{animation:spinKnob .6s linear infinite;}
  @keyframes spinKnob{ to{ transform:rotate(360deg);} }

  .slot{
    margin-top:16px;
    width:150px;height:34px;
    background:#0f0c1e;
    border-radius:10px;
    box-shadow:inset 0 4px 8px rgba(0,0,0,0.6);
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.15em;
  }

  .fallzone{
    height:70px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    position:relative;
  }
  .falling-capsule{
    width:40px;height:40px;
    border-radius:50%;
    position:relative;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,0.18), inset 3px 3px 0 rgba(255,255,255,0.25);
    opacity:0;
  }
  .falling-capsule.drop{
    animation: dropDown .55s cubic-bezier(.5,0,.7,1) forwards;
  }
  @keyframes dropDown{
    0%{opacity:1; transform:translateY(-10px) scale(0.9);}
    70%{opacity:1; transform:translateY(38px) scale(1.05);}
    100%{opacity:0; transform:translateY(46px) scale(1.05);}
  }

  /* ---- Result card ---- */
  .card{
    width:min(360px,90vw);
    margin-top:6px;
    background:var(--bg-panel);
    border:2px solid var(--line);
    border-radius:18px;
    padding:26px 24px 22px;
    text-align:center;
    opacity:0;
    transform:translateY(14px) scale(.96);
    transition:opacity .45s ease, transform .45s ease;
  }
  .card.show{opacity:1; transform:translateY(0) scale(1);}
  .card .flag{font-size:38px; display:block; margin-bottom:6px;}
  .card .tag{
    font-family:'Baloo 2';
    font-size:11px;
    letter-spacing:.2em;
    color:var(--turmeric);
    text-transform:uppercase;
    font-weight:700;
  }
  .card .dish{
    font-size:26px;
    font-weight:900;
    margin:8px 0 4px;
  }
  .card .brand{
    color:var(--muted);
    font-size:14px;
  }
  .card .brand b{color:var(--paper); font-weight:700;}

  .actions{
    margin-top:22px;
    display:flex;
    gap:12px;
  }
  .again-btn{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-family:'Noto Sans TC';
    font-size:13px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .again-btn:hover{border-color:var(--guava); background:rgba(255,93,115,0.1);}

  .hint{
    margin-top:34px;
    color:var(--muted);
    font-size:12px;
    max-width:320px;
    text-align:center;
    line-height:1.7;
  }

  @media (prefers-reduced-motion: reduce){
    .capsule, .knob.spin-anim, .falling-capsule.drop{animation:none !important;}
  }
</style>
</head>
<body>

  <div class="eyebrow">Dinner Decision Machine</div>
  <h1>今晚吃<span>什麼</span>？</h1>
  <div class="sub">轉一下，交給緣分決定 — 已收錄各國料理與連鎖品牌</div>

  <div class="machine-wrap">
    <div class="dome" id="dome">
      <div class="capsule c1"></div>
      <div class="capsule c2"></div>
      <div class="capsule c3"></div>
      <div class="capsule c4"></div>
      <div class="capsule c5"></div>
      <div class="capsule c6"></div>
      <div class="capsule c7"></div>
      <div class="capsule c8"></div>
      <div class="capsule c9"></div>
    </div>
    <div class="base">
      <button class="knob" id="crankBtn">轉一下</button>
      <div class="slot">出口 · OUTPUT</div>
    </div>
  </div>

  <div class="fallzone" id="fallzone"></div>

  <div class="card" id="card">
    <span class="flag" id="cardFlag">🍜</span>
    <div class="tag" id="cardTag">JAPAN · 日式</div>
    <div class="dish" id="cardDish">豚骨拉麵</div>
    <div class="brand" id="cardBrand">推薦品牌：<b>一風堂</b></div>
  </div>

  <div class="actions" id="actions" style="display:none;">
    <button class="again-btn" id="againBtn">不滿意，再轉一次</button>
  </div>

  <div class="hint">小提醒：扭到不喜歡的可以「再轉一次」，但只限一次唷 — 緣分只給你兩次機會 😄</div>

<script>
const pool = [
  {flag:'🍜', tag:'JAPAN · 日式', dish:'豚骨拉麵', brand:'一風堂 / 豚王'},
  {flag:'🍣', tag:'JAPAN · 日式', dish:'迴轉壽司', brand:'爭鮮 / 壽司郎'},
  {flag:'🍱', tag:'JAPAN · 日式', dish:'燒肉定食', brand:'安安 / 乾杯'},
  {flag:'🍚', tag:'JAPAN · 日式', dish:'炸豬排丼飯', brand:'大戶屋'},
  {flag:'🍗', tag:'KOREA · 韓式', dish:'韓式炸雞配啤酒', brand:'bb.q / 起家雞'},
  {flag:'🍲', tag:'KOREA · 韓式', dish:'部隊鍋', brand:'涓豆腐 / 8色韓炒'},
  {flag:'🥢', tag:'KOREA · 韓式', dish:'石鍋拌飯', brand:'本家'},
  {flag:'🍔', tag:'USA · 美式', dish:'手作漢堡', brand:'摩斯漢堡 / Shake Shack'},
  {flag:'🍟', tag:'USA · 美式', dish:'炸雞全餐', brand:'肯德基'},
  {flag:'🥩', tag:'USA · 美式', dish:'牛排', brand:'貴族世家 / 王品'},
  {flag:'🍕', tag:'ITALY · 義式', dish:'手工披薩', brand:'達美樂 / Pizza Hut'},
  {flag:'🍝', tag:'ITALY · 義式', dish:'奶油培根義大利麵', brand:'Pizza Marzano'},
  {flag:'🥟', tag:'TAIWAN/CN · 中式', dish:'小籠包套餐', brand:'鼎泰豐'},
  {flag:'🍜', tag:'TAIWAN · 台式', dish:'紅燒牛肉麵', brand:'老擔牛肉麵'},
  {flag:'🍛', tag:'TAIWAN · 台式', dish:'滷肉飯配黑白切', brand:'金峰 / 三commix'},
  {flag:'🍢', tag:'TAIWAN · 台式', dish:'鹽酥雞拼盤', brand:'巷口鹽酥雞攤'},
  {flag:'🥘', tag:'TAIWAN · 台式', dish:'薑母鴨火鍋', brand:'薑母鴨專賣店'},
  {flag:'🍲', tag:'CHINA · 港澳', dish:'燒臘飯', brand:'再興 / 阿新'},
  {flag:'🍲', tag:'CHINA · 川式', dish:'麻辣鍋', brand:'海底撈 / 呷哺呷哺'},
  {flag:'🌶️', tag:'THAILAND · 泰式', dish:'打拋豬配蛋', brand:'瓦城'},
  {flag:'🍛', tag:'THAILAND · 泰式', dish:'綠咖哩雞', brand:'發現曼谷'},
  {flag:'🌮', tag:'MEXICO · 墨西哥', dish:'塔可拼盤', brand:'Tacos & Co.'},
  {flag:'🍛', tag:'INDIA · 印度', dish:'咖哩配烤餅', brand:'先鋒印度廚房'},
  {flag:'🍜', tag:'VIETNAM · 越式', dish:'牛肉河粉', brand:'Pho 24'},
  {flag:'🥗', tag:'HEALTHY · 輕食', dish:'雞胸沙拉碗', brand:'Subway / 樂沙'},
  {flag:'🍞', tag:'FRANCE · 法式', dish:'可頌早午餐', brand:'Miacucina'},
];

let lastIndex = -1;
let rerollUsed = false;

const dome = document.getElementById('dome');
const crankBtn = document.getElementById('crankBtn');
const fallzone = document.getElementById('fallzone');
const card = document.getElementById('card');
const actions = document.getElementById('actions');
const againBtn = document.getElementById('againBtn');

const capsuleColors = ['#ff5d73','#ffc145','#3ddc97','#b18cff'];

function pickIndex(){
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (idx === lastIndex && pool.length > 1);
  lastIndex = idx;
  return idx;
}

function renderCard(item){
  document.getElementById('cardFlag').textContent = item.flag;
  document.getElementById('cardTag').textContent = item.tag;
  document.getElementById('cardDish').textContent = item.dish;
  document.getElementById('cardBrand').innerHTML = '推薦品牌：<b>' + item.brand + '</b>';
}

function spin(){
  crankBtn.disabled = true;
  card.classList.remove('show');
  actions.style.display = 'none';
  dome.classList.add('shaking');
  crankBtn.classList.add('spin-anim');
  crankBtn.textContent = '⋯';

  setTimeout(() => {
    dome.classList.remove('shaking');
    crankBtn.classList.remove('spin-anim');

    // falling capsule animation
    fallzone.innerHTML = '';
    const fc = document.createElement('div');
    fc.className = 'falling-capsule';
    fc.style.background = capsuleColors[Math.floor(Math.random()*capsuleColors.length)];
    fallzone.appendChild(fc);
    requestAnimationFrame(() => fc.classList.add('drop'));

    setTimeout(() => {
      const item = pool[pickIndex()];
      renderCard(item);
      card.classList.add('show');
      actions.style.display = 'flex';
      crankBtn.disabled = false;
      crankBtn.textContent = '轉一下';
      rerollUsed = false;
      againBtn.textContent = '不滿意，再轉一次';
      againBtn.disabled = false;
    }, 500);
  }, 900);
}

crankBtn.addEventListener('click', spin);

againBtn.addEventListener('click', () => {
  if (rerollUsed) return;
  rerollUsed = true;
  againBtn.disabled = true;
  spin();
});
</script>
</body>
</html>
