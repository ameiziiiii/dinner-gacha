<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚餐扭蛋機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161327;
    --bg-mid:#201c38;
    --bg-panel:#2a2447;
    --paper:#f6efe1;
    --muted:#a79bd1;
    --guava:#ff5d73;
    --turmeric:#ffc145;
    --scallion:#3ddc97;
    --grape:#b18cff;
    --line: rgba(246,239,225,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #352c5c 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid) 60%, var(--bg-deep));
    color:var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
    overflow-x:hidden;
  }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:.35em;
    font-size:12px;
    color:var(--turmeric);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-size:clamp(28px,5vw,42px);
    margin:0 0 6px;
    font-weight:900;
    text-align:center;
    line-height:1.3;
  }
  h1 span{color:var(--guava);}
  .sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:30px;
    text-align:center;
  }

  /* ---- Gacha machine ---- */
  .machine-wrap{
    position:relative;
    width:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .dome{
    width:230px;
    height:190px;
    border-radius:130px 130px 20px 20px;
    background:linear-gradient(160deg, rgba(246,239,225,0.16), rgba(246,239,225,0.03) 60%);
    border:3px solid var(--line);
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 -20px 40px rgba(0,0,0,0.35), 0 0 40px rgba(177,140,255,0.15);
  }
  .capsule{
    position:absolute;
    width:34px;height:34px;
    border-radius:50%;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,0.18), inset 3px 3px 0 rgba(255,255,255,0.25);
    animation: jiggle 3.2s ease-in-out infinite;
  }
  .capsule::after{
    content:'';
    position:absolute;
    left:0;right:0;top:47%;
    height:2px;
    background:rgba(0,0,0,0.18);
  }
  .c1{background:var(--guava); top:18px; left:20px; animation-delay:.1s;}
  .c2{background:var(--turmeric); top:10px; left:80px; animation-delay:.5s;}
  .c3{background:var(--scallion); top:22px; left:145px; animation-delay:.2s;}
  .c4{background:var(--grape); top:55px; left:50px; animation-delay:.7s;}
  .c5{background:var(--turmeric); top:60px; left:110px; animation-delay:.35s;}
  .c6{background:var(--scallion); top:58px; left:170px; animation-delay:.9s;}
  .c7{background:var(--guava); top:92px; left:85px; animation-delay:.15s;}
  .c8{background:var(--grape); top:95px; left:145px; animation-delay:.6s;}
  .c9{background:var(--turmeric); top:100px; left:25px; animation-delay:.45s;}

  @keyframes jiggle{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-4px) rotate(4deg);}
  }
  .shaking .capsule{animation: shake .4s ease-in-out infinite;}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    25%{transform:translate(-3px,2px) rotate(-8deg);}
    50%{transform:translate(3px,-2px) rotate(8deg);}
    75%{transform:translate(-2px,-3px) rotate(-6deg);}
  }

  .base{
    width:250px;
    height:150px;
    background:linear-gradient(180deg, var(--bg-panel), #1d1938);
    border:3px solid var(--line);
    border-top:none;
    border-radius:0 0 22px 22px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:16px;
  }
  .knob{
    width:64px;height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe3a8, var(--turmeric));
    box-shadow:0 4px 0 #b8862a, 0 6px 10px rgba(0,0,0,0.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';
    font-weight:800;
    color:#5c3d0d;
    font-size:12px;
    user-select:none;
    transition:transform .15s;
    border:none;
  }
  .knob:active{transform:translateY(3px);box-shadow:0 1px 0 #b8862a;}
  .knob:disabled{opacity:.55;cursor:default;}
  .knob.spin-anim{animation:spinKnob .6s linear infinite;}
  @keyframes spinKnob{ to{ transform:rotate(360deg);} }

  .slot{
    margin-top:16px;
    width:150px;height:34px;
    background:#0f0c1e;
    border-radius:10px;
    box-shadow:inset 0 4px 8px rgba(0,0,0,0.6);
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.15em;
  }

  .fallzone{
    height:70px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    position:relative;
  }
  .falling-capsule{
    width:40px;height:40px;
    border-radius:50%;
    position:relative;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,0.18), inset 3px 3px 0 rgba(255,255,255,0.25);
    opacity:0;
  }
  .falling-capsule.drop{
    animation: dropDown .55s cubic-bezier(.5,0,.7,1) forwards;
  }
  @keyframes dropDown{
    0%{opacity:1; transform:translateY(-10px) scale(0.9);}
    70%{opacity:1; transform:translateY(38px) scale(1.05);}
    100%{opacity:0; transform:translateY(46px) scale(1.05);}
  }

  /* ---- Result card ---- */
  .card{
    width:min(360px,90vw);
    margin-top:6px;
    background:var(--bg-panel);
    border:2px solid var(--line);
    border-radius:18px;
    padding:26px 24px 22px;
    text-align:center;
    opacity:0;
    transform:translateY(14px) scale(.96);
    transition:opacity .45s ease, transform .45s ease;
  }
  .card.show{opacity:1; transform:translateY(0) scale(1);}
  .card .flag{font-size:38px; display:block; margin-bottom:6px;}
  .card .tag{
    font-family:'Baloo 2';
    font-size:11px;
    letter-spacing:.2em;
    color:var(--turmeric);
    text-transform:uppercase;
    font-weight:700;
  }
  .card .dish{
    font-size:26px;
    font-weight:900;
    margin:8px 0 4px;
  }
  .card .brand{
    color:var(--muted);
    font-size:14px;
  }
  .card .brand b{color:var(--paper); font-weight:700;}
  .card .rating{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--turmeric);
    font-weight:700;
  }
  .card .rating span{color:var(--muted); font-weight:400;}
  .map-link{
    display:inline-block;
    margin-top:16px;
    background:var(--guava);
    color:#2b0f16;
    text-decoration:none;
    font-weight:700;
    font-size:13px;
    padding:10px 20px;
    border-radius:999px;
    transition:transform .15s, background .2s;
  }
  .map-link:hover{background:#ff7c8d; transform:translateY(-1px);}

  .actions{
    margin-top:22px;
    display:flex;
    gap:12px;
  }
  .again-btn{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--paper);
    padding:10px 18px;
    border-radius:999px;
    font-family:'Noto Sans TC';
    font-size:13px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .again-btn:hover{border-color:var(--guava); background:rgba(255,93,115,0.1);}

  .hint{
    margin-top:34px;
    color:var(--muted);
    font-size:12px;
    max-width:320px;
    text-align:center;
    line-height:1.7;
  }

  @media (prefers-reduced-motion: reduce){
    .capsule, .knob.spin-anim, .falling-capsule.drop{animation:none !important;}
  }
</style>
</head>
<body>

  <div class="eyebrow">Dinner Decision Machine</div>
  <h1>今晚吃<span>什麼</span>？</h1>
  <div class="sub">轉一下，交給緣分決定 — 29 個信義區真實選項，含麥當勞、Subway、肯德基、達美樂等連鎖，以及鹹水雞、便當等外帶美食</div>

  <div class="machine-wrap">
    <div class="dome" id="dome">
      <div class="capsule c1"></div>
      <div class="capsule c2"></div>
      <div class="capsule c3"></div>
      <div class="capsule c4"></div>
      <div class="capsule c5"></div>
      <div class="capsule c6"></div>
      <div class="capsule c7"></div>
      <div class="capsule c8"></div>
      <div class="capsule c9"></div>
    </div>
    <div class="base">
      <button class="knob" id="crankBtn">轉一下</button>
      <div class="slot">出口 · OUTPUT</div>
    </div>
  </div>

  <div class="fallzone" id="fallzone"></div>

  <div class="card" id="card">
    <span class="flag" id="cardFlag">🍜</span>
    <div class="tag" id="cardTag">JAPAN · 日式</div>
    <div class="dish" id="cardDish">豚骨拉麵</div>
    <div class="brand" id="cardBrand">推薦餐廳：<b>一風堂</b></div>
    <div class="rating" id="cardRating">⭐ 4.8 <span>· 信義區</span></div>
    <br>
    <a class="map-link" id="cardMap" href="#" target="_blank" rel="noopener">在地圖上查看</a>
  </div>

  <div class="actions" id="actions" style="display:none;">
    <button class="again-btn" id="againBtn">不滿意，再轉一次</button>
  </div>

  <div class="hint">小提醒：扭到不喜歡的可以「再轉一次」，但只限一次唷 — 緣分只給你兩次機會 😄</div>

<script>
// 信義區真實餐廳/店家清單（資料取自 Google 地圖，含評分；全數可外帶）
const pool = [
  {flag:'🍣', tag:'JAPAN · 日式丼飯', dish:'生魚片丼飯（可外帶）', brand:'魚躍日式料理 北醫店', rating:4.8, pid:'ChIJ3TgUKLWrQjQRdyNCbtxTnVM'},
  {flag:'🍣', tag:'JAPAN · 日式壽司', dish:'握壽司 / 生魚片丼（可外帶）', brand:'林居sushi 永吉店', rating:4.8, pid:'ChIJZSnJbYWrQjQRl8oNo7MZKg0'},
  {flag:'🥩', tag:'JAPAN · 日式燒肉丼', dish:'燒肉牛丼（可外帶）', brand:'GYUU NIKU ステーキ専門店', rating:4.6, pid:'ChIJhxtvkqOrQjQRbbpjh4uldU8'},
  {flag:'🍛', tag:'JAPAN · 日式咖哩', dish:'炸豬排咖哩飯（可外帶）', brand:'羅本家咖哩 信義店', rating:4.9, pid:'ChIJaQ1CwlSrQjQRorOr1NX638w'},
  {flag:'🍛', tag:'JAPAN · 日式咖哩', dish:'唐揚雞咖哩飯（可外帶）', brand:'Curry For Peace', rating:4.7, pid:'ChIJdbSSOMqrQjQRJA2KtQ4zaSE'},
  {flag:'🍗', tag:'KOREA · 韓式燉雞', dish:'韓式燉雞（可外帶）', brand:'Twozzim 韓國燉雞', rating:4.9, pid:'ChIJJ4zWvACrQjQRfklXErrIHi0'},
  {flag:'🍔', tag:'USA · 美式漢堡', dish:'手工牛肉漢堡（可外帶）', brand:'Awesome Burger', rating:4.7, pid:'ChIJoeYaSrmrQjQRl7CUbo2Pluc'},
  {flag:'🍗', tag:'USA · 美式漢堡', dish:'炸雞漢堡配鬆餅（可外帶）', brand:'BURGER OUT', rating:4.6, pid:'ChIJAytZQDirQjQRgE8YUFmgaMY'},
  {flag:'🍔', tag:'USA · 美式漢堡', dish:'經典起司漢堡（可外帶）', brand:"Lin's Burger", rating:4.5, pid:'ChIJZWIJ8WirQjQRlgqCl4LX-tI'},
  {flag:'🍔', tag:'USA · 美式漢堡', dish:'炭烤厚切漢堡（可外帶）', brand:'BURNT BURGER SOCIAL CLUB', rating:4.4, pid:'ChIJzYnsPQCrQjQRtxhA1aMxwDo'},
  {flag:'🍕', tag:'ITALY · 義式披薩', dish:'拿坡里手工披薩（可外帶）', brand:'披薩3次方', rating:4.7, pid:'ChIJc2bzzPCrQjQRLbtiNwu4-Rg'},
  {flag:'🍚', tag:'TAIWAN · 台式', dish:'滷肉飯 / 竹筍排骨湯（可外帶）', brand:'春發號滷肉飯', rating:4.4, pid:'ChIJi255bOmrQjQRI_ZZTaozvF8'},
  {flag:'🧊', tag:'TAIWAN · 台式小吃', dish:'臭豆腐 / 米血糕（可外帶）', brand:'正純小吃店', rating:4.6, pid:'ChIJmWcpDaqrQjQRBZRq3SnVGGo'},
  {flag:'🍛', tag:'THAILAND · 泰式', dish:'泰式海南雞飯（可外帶）', brand:'銀泰泰式海南雞飯', rating:4.9, pid:'ChIJM6t9T3irQjQRDB_wDoxPw8o'},
  {flag:'🦆', tag:'HK/CN · 港點烤鴨', dish:'烤鴨 / 港式點心（可外帶）', brand:'芯聚苑 烤鴨港點', rating:4.5, pid:'ChIJLyleWQCrQjQROLcnNgBHhcw'},
  {flag:'🍱', tag:'TAIWAN · 台菜便當', dish:'商業便當 / 包場台菜（可外帶）', brand:'大吉團 Lucky Bowl', rating:4.8, pid:'ChIJe_eHWwCrQjQR5C3mV1-PJms'},
  {flag:'🍜', tag:'VIETNAM · 越式河粉', dish:'酸辣牛肉河粉（可外帶）', brand:'Y Đình 越南料理', rating:4.6, pid:'ChIJt1iua7arQjQRg9pQ264yhT4'},
  {flag:'🍟', tag:'CHAIN · 連鎖速食', dish:'大麥克全餐（外帶）', brand:"McDonald's 莊敬路店", rating:3.8, pid:'ChIJjfzEsLCrQjQRN8ctcgH9pxQ'},
  {flag:'🥪', tag:'CHAIN · 連鎖潛艇堡', dish:'潛艇堡套餐（外帶）', brand:'Subway 松德店', rating:3.4, pid:'ChIJQbeYqqarQjQRay6wJlRKglA'},
  {flag:'🍗', tag:'CHAIN · 連鎖速食', dish:'原味炸雞桶（外帶）', brand:'KFC 莊敬店', rating:3.5, pid:'ChIJqzYI6rSrQjQRmVATBSAx7VE'},
  {flag:'🍔', tag:'CHAIN · 連鎖漢堡', dish:'米漢堡套餐（外帶）', brand:'MOS BURGER TWTC店', rating:3.6, pid:'ChIJ7RVlNLqrQjQRDZ2U40PhRnM'},
  {flag:'🍕', tag:'CHAIN · 連鎖披薩', dish:'雙層起司披薩（外帶/外送）', brand:"達美樂 Domino's Pizza", rating:4.1, pid:'ChIJCeKi16KrQjQRQTaO1gmsGgc'},
  {flag:'🍗', tag:'TAIWAN · 鹽酥雞/滷味', dish:'鹽酥雞拼盤（外帶）', brand:'台灣香鹽酥雞', rating:4.8, pid:'ChIJYZneYACrQjQRR2Ht0FEC6eI'},
  {flag:'🥗', tag:'TAIWAN · 鹹水雞', dish:'鹹水雞切盤（外帶）', brand:'極品鹽水雞', rating:4.3, pid:'ChIJX5s9vvarQjQR6OtkjFwCd1U'},
  {flag:'🥗', tag:'TAIWAN · 鹹水雞', dish:'鹹水雞切盤（外帶）', brand:'唸嘴鹹水雞', rating:4.0, pid:'ChIJ_aZue0arQjQRG0uyhdeVz88'},
  {flag:'🍱', tag:'TAIWAN · 便當', dish:'招牌炸雞腿便當（外帶）', brand:'阿布便當', rating:5.0, pid:'ChIJ8eu-QeurQjQRUvtmPVoM2vo'},
  {flag:'🍱', tag:'TAIWAN · 便當', dish:'商務便當 / 客製餐盒（外帶）', brand:'杉盒便當製所', rating:4.5, pid:'ChIJW8lsYrKrQjQRsSGSN6xbONI'},
  {flag:'🍱', tag:'JAPAN · 日式便當', dish:'牛肉丼便當（外帶）', brand:'MAKOTO丼 日式便當專賣', rating:4.7, pid:'ChIJXRSy6qGrQjQR7gS05ywy2f0'},
  {flag:'🍱', tag:'TAIWAN · 烤肉飯', dish:'烤肉飯便當（外帶）', brand:'犇野烤肉飯', rating:4.3, pid:'ChIJ0baw1BmrQjQRs_1iZN4ObJ8'},
];

let lastIndex = -1;
let rerollUsed = false;

const dome = document.getElementById('dome');
const crankBtn = document.getElementById('crankBtn');
const fallzone = document.getElementById('fallzone');
const card = document.getElementById('card');
const actions = document.getElementById('actions');
const againBtn = document.getElementById('againBtn');

const capsuleColors = ['#ff5d73','#ffc145','#3ddc97','#b18cff'];

function pickIndex(){
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (idx === lastIndex && pool.length > 1);
  lastIndex = idx;
  return idx;
}

function renderCard(item){
  document.getElementById('cardFlag').textContent = item.flag;
  document.getElementById('cardTag').textContent = item.tag;
  document.getElementById('cardDish').textContent = item.dish;
  document.getElementById('cardBrand').innerHTML = '推薦餐廳：<b>' + item.brand + '</b>';
  document.getElementById('cardRating').innerHTML = '⭐ ' + item.rating.toFixed(1) + ' <span>· 信義區</span>';
  document.getElementById('cardMap').href = 'https://www.google.com/maps/place/?q=place_id:' + item.pid;
}

function spin(){
  crankBtn.disabled = true;
  card.classList.remove('show');
  actions.style.display = 'none';
  dome.classList.add('shaking');
  crankBtn.classList.add('spin-anim');
  crankBtn.textContent = '⋯';

  setTimeout(() => {
    dome.classList.remove('shaking');
    crankBtn.classList.remove('spin-anim');

    // falling capsule animation
    fallzone.innerHTML = '';
    const fc = document.createElement('div');
    fc.className = 'falling-capsule';
    fc.style.background = capsuleColors[Math.floor(Math.random()*capsuleColors.length)];
    fallzone.appendChild(fc);
    requestAnimationFrame(() => fc.classList.add('drop'));

    setTimeout(() => {
      const item = pool[pickIndex()];
      renderCard(item);
      card.classList.add('show');
      actions.style.display = 'flex';
      crankBtn.disabled = false;
      crankBtn.textContent = '轉一下';
      rerollUsed = false;
      againBtn.textContent = '不滿意，再轉一次';
      againBtn.disabled = false;
    }, 500);
  }, 900);
}

crankBtn.addEventListener('click', spin);

againBtn.addEventListener('click', () => {
  if (rerollUsed) return;
  rerollUsed = true;
  againBtn.disabled = true;
  spin();
});
</script>
</body>
</html>
